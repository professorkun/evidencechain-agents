<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>多 Agent 工作台</title>
  <style>
    :root { color-scheme: dark; --bg:#09121f; --panel:#111d2c; --panel-2:#142235; --line:#26374d; --text:#edf4ff; --muted:#9caec5; --blue:#2583f7; --green:#56d797; --yellow:#ffbf3f; }
    * { box-sizing:border-box; } body { margin:0; min-width:980px; background:var(--bg); color:var(--text); font:14px/1.5 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; }
    button, input, select { font:inherit; } button { cursor:pointer; } .shell { min-height:100vh; display:grid; grid-template-columns:240px minmax(650px,1fr) 390px; background:radial-gradient(circle at 55% 10%,#142844 0,transparent 30%),var(--bg); }
    .side { border-right:1px solid var(--line); padding:22px 14px; display:flex; flex-direction:column; gap:26px; background:linear-gradient(180deg,#0b1725,#0a1521); }.brand { display:flex; align-items:center; gap:11px; padding:0 7px; font-weight:700; font-size:20px; white-space:nowrap; }.brand-mark { color:#4b9cff; font-size:30px; line-height:1; }
    nav { display:grid; gap:7px; } nav button { color:#b7c6d9; border:0; background:transparent; padding:12px 14px; text-align:left; border-radius:8px; font-size:16px; } nav button:hover,nav button.active { color:#cfe5ff; background:#123961; box-shadow:inset 3px 0 #2491ff; }
    .local-status { margin-top:auto; padding:16px; border:1px solid var(--line); border-radius:12px; background:#0d1927; color:var(--muted); }.online { color:var(--text); font-weight:650; }.dot { display:inline-block; width:11px; height:11px; border-radius:50%; background:var(--green); margin-right:8px; box-shadow:0 0 14px #39d581; }.local-status p { margin:7px 0 0; }.local-status hr { border:0; border-top:1px solid var(--line); margin:12px 0; }
    .main { padding:24px 12px 28px; min-width:0; }.top { display:flex; justify-content:space-between; align-items:center; gap:16px; padding:0 14px 20px; }.top h1 { margin:0; font-size:30px; letter-spacing:.5px; }.top p { margin:4px 0 0; color:var(--muted); font-size:16px; }.controls { display:flex; gap:9px; align-items:center; }.control { height:38px; border:1px solid #354b65; border-radius:7px; background:#111e2e; color:#b7c6d9; padding:0 12px; }.search { width:148px; }.primary { height:38px; border:0; border-radius:7px; color:white; background:linear-gradient(180deg,#4199ff,#1670e9); padding:0 14px; font-weight:650; box-shadow:0 4px 12px #0c59bd66; }.primary:hover { filter:brightness(1.1); }
    #create-panel { margin:0 14px 14px; padding:13px; display:flex; gap:10px; background:#13243a; border:1px solid #2a5e90; border-radius:9px; }.task-input { flex:1; min-width:0; height:38px; border:1px solid #40546d; border-radius:6px; background:#0b1724; color:var(--text); padding:0 12px; }
    .board { display:grid; grid-template-columns:repeat(4,minmax(170px,1fr)); gap:9px; padding:0 2px; }.column { min-height:690px; padding:10px 8px; background:linear-gradient(180deg,#132134,#111d2d); border-radius:11px; }.column-head { display:flex; align-items:center; gap:10px; padding:7px 9px 13px; font-weight:700; font-size:16px; }.column-icon { font-size:19px; }.count { min-width:24px; height:24px; text-align:center; padding:2px 7px; border-radius:20px; background:#27384d; color:#d9e7f8; font-size:13px; }.empty { color:#66809d; font-size:13px; padding:14px 9px; }.task { position:relative; margin:0 0 10px; padding:14px; border:1px solid #314359; border-radius:9px; background:linear-gradient(145deg,#1b2a3c,#172536); box-shadow:0 8px 18px #02081133; cursor:pointer; transition:.16s ease; }.task:hover,.task.selected { transform:translateY(-1px); border-color:#348fff; box-shadow:0 0 0 1px #167fe8,0 10px 22px #05101e66; }.task h3 { margin:0 0 6px; color:#f3f7ff; font-size:15px; }.task p { margin:0 0 13px; min-height:40px; color:#a4b4c9; font-size:13px; }.task-foot { display:flex; align-items:center; justify-content:space-between; gap:5px; color:#97a9c0; font-size:12px; }.tag { border-radius:15px; padding:4px 9px; background:#2e4158; color:#c9d9ed; }.agent { color:#bdd5ef; white-space:nowrap; }
    .detail { border-left:1px solid var(--line); background:linear-gradient(180deg,#101d2c,#0d1825); padding:24px 20px; overflow:auto; }.detail-empty { color:var(--muted); margin-top:70px; text-align:center; }.detail-top { display:flex; justify-content:space-between; gap:10px; }.detail h2 { font-size:20px; margin:0 0 10px; }.close { color:#93a9c4; border:0; background:transparent; font-size:26px; line-height:1; }.detail-meta { color:#a9bad0; margin-bottom:18px; }.tabs { display:flex; gap:30px; border-bottom:1px solid var(--line); margin-bottom:21px; }.tab { border:0; background:transparent; color:#9fb1c7; padding:10px 0; }.tab.active { color:#4d9fff; border-bottom:2px solid #258bf8; }.section { margin:0 0 24px; }.section h3 { display:flex; gap:9px; align-items:center; margin:0 0 13px; font-size:16px; }.section dl { display:grid; grid-template-columns:86px 1fr; gap:10px 12px; color:#aebdd0; margin:0; }.section dt { color:#8ea1b8; }.check { color:var(--green); margin-right:7px; }.contract { padding:12px; border:1px solid #2d4259; border-radius:8px; background:#132033; color:#bdcce0; white-space:pre-wrap; word-break:break-word; }.event { padding:8px 0; border-bottom:1px solid #24364b; color:#acbdd0; font-size:12px; }.agent-report { margin:8px 0; padding:11px; border:1px solid #2c557b; border-radius:8px; background:#112338; }.agent-report strong { color:#7bb9ff; }.agent-report p { margin:6px 0 0; color:#c9d8e9; white-space:pre-wrap; }.approve { width:100%; height:43px; border:0; border-radius:7px; background:linear-gradient(180deg,#ffcf55,#ffb627); color:#172130; font-weight:800; font-size:15px; }.approve:hover { filter:brightness(1.06); }.notice { border:1px solid #217d55; background:#123728; color:#93e7ba; border-radius:8px; padding:12px; }.notice strong { display:block; }.readonly { color:#9eb2c8; font-size:12px; }
    @media (max-width:1250px) { .shell { grid-template-columns:205px minmax(620px,1fr) 330px; }.side { padding-left:8px; padding-right:8px; }.search { display:none; } }
  </style>
</head>
<body>
  <main class="shell">
    <aside class="side"><div class="brand"><span class="brand-mark">♟</span><span>多 Agent 工作台</span></div><nav aria-label="工作台导航"><button class="active" type="button">▣　任务看板</button><button type="button">⚙　Agent 管理</button><button type="button">▣　资源与工具</button><button type="button">▣　本地环境</button><button type="button">⚙　设置</button></nav><div class="local-status"><div class="online"><span class="dot"></span>本地运行中</div><p>多 Agent 协同 · 轻量高效</p><hr><p>专注于你的本地任务<br>更可控 · 更安全 · 更高效</p></div></aside>
    <section class="main"><header class="top"><div><h1>多 Agent 工作台</h1><p>在本地，和多个 Agent 一起完成复杂任务</p></div><div class="controls"><select class="control" aria-label="任务筛选"><option>全部任务</option></select><input class="control search" placeholder="⌕ 搜索任务…"><button class="primary" id="new-task" type="button">＋ 新建任务</button></div></header><section id="create-panel" hidden><input id="task-title" class="task-input" placeholder="输入任务名称，例如：整理测试报告"><button id="create-submit" class="primary" type="button">保存并进入讨论</button></section><section class="board" aria-label="任务看板"><div class="column"><div class="column-head"><span class="column-icon">▱</span>讨论中 <span class="count" id="count-deliberating">0</span></div><div data-column="deliberating,draft"></div></div><div class="column"><div class="column-head"><span class="column-icon">◕</span>待确认 <span class="count" id="count-awaiting_approval">0</span></div><div data-column="awaiting_approval"></div></div><div class="column"><div class="column-head"><span class="column-icon">⚙</span>执行中 <span class="count" id="count-executing">0</span></div><div data-column="queued,running"></div></div><div class="column"><div class="column-head"><span class="column-icon">●</span>验证 / 待合并 <span class="count" id="count-verifying">0</span></div><div data-column="verifying,awaiting_merge"></div></div></section></section>
    <aside class="detail" id="detail" aria-live="polite"><div class="detail-empty">从看板选择一个任务<br><span class="readonly">任务合同、审批和审计记录会显示在这里。</span></div></aside>
  </main>
  <script>
    const detail=document.getElementById('detail'); const groups={deliberating:['deliberating','draft'],awaiting_approval:['awaiting_approval'],executing:['queued','running'],verifying:['verifying','awaiting_merge']}; const label={draft:'草稿',deliberating:'讨论中',awaiting_approval:'待确认',queued:'已确认，待执行',running:'执行中',verifying:'验证中',awaiting_merge:'验证通过，待合并'}; let selectedId='';
    async function request(url,options){const response=await fetch(url,options);if(!response.ok){const body=await response.json();throw new Error(body.detail||'请求失败');}return response.json();}
    function taskCard(task){const card=document.createElement('article');card.className='task'+(task.id===selectedId?' selected':'');const roleStatus=task.agent_reports.length?`◉ 讨论 ${task.agent_reports.length}/3`:'◉ 等待讨论';card.innerHTML=`<h3>${task.title}</h3><p>${label[task.status]||task.status} · 仅本机记录</p><div class="task-foot"><span class="tag">${label[task.status]||task.status}</span><span class="agent">${roleStatus}</span></div>`;card.onclick=()=>showDetail(task.id);return card;}
    async function load(){const tasks=await request('/api/tasks');for(const [name,statuses] of Object.entries(groups)){const column=document.querySelector(`[data-column="${statuses.join(',')}"]`);const shown=tasks.filter(task=>statuses.includes(task.status));column.replaceChildren();document.getElementById('count-'+name).textContent=shown.length;if(!shown.length){column.innerHTML='<p class="empty">暂无任务</p>';}else shown.forEach(task=>column.append(taskCard(task)));}}
    function renderEvents(events){if(!events.length)return '<p class="readonly">暂无审计记录</p>';return events.map(event=>`<div class="event">${event.at.replace('T',' ').replace('+00:00',' UTC')}　${event.actor}　${event.type}</div>`).join('');}
    function renderReports(reports){if(!reports.length)return '<p class="readonly">尚未启动讨论。方案、反方和调研 Agent 都只读取任务文本，不会执行命令或写入文件。</p>';return reports.map(report=>`<article class="agent-report"><strong>● ${report.role} · 已完成</strong><p>${report.content}</p></article>`).join('');}
    async function showDetail(id){const tasks=await request('/api/tasks');const task=tasks.find(item=>item.id===id);if(!task)return;selectedId=id;await load();const contract=Object.keys(task.contract).length?JSON.stringify(task.contract,null,2):'尚未附加任务合同。当前任务不会派发 Agent、执行 SSH 或自动合并。';const waiting=task.status==='awaiting_approval';const discussing=task.status==='deliberating'&&!task.agent_reports.length;const readyForApproval=task.status==='deliberating'&&task.agent_reports.length;detail.innerHTML=`<div class="detail-top"><div><h2>${task.title}</h2><div class="detail-meta">${label[task.status]||task.status}　·　仅本机任务</div></div><button class="close" id="close-detail" aria-label="关闭详情">×</button></div><div class="tabs"><button class="tab active" type="button">详情</button><button class="tab" type="button">日志</button><button class="tab" type="button">产物</button><button class="tab" type="button">讨论</button></div><section class="section"><h3>◉　三角色讨论</h3>${renderReports(task.agent_reports)}</section><section class="section"><h3>▣　任务合同</h3><dl><dt>目标</dt><dd>在用户明确确认后，才进入下一阶段。</dd><dt>当前状态</dt><dd>${label[task.status]||task.status}</dd><dt>验收标准</dt><dd><span class="check">✓</span>范围明确<br><span class="check">✓</span>人工确认后才入队<br><span class="check">✓</span>保留完整审计记录</dd></dl></section><section class="section"><h3>▱　允许的范围</h3><div class="contract">${contract}</div></section><section class="section"><h3>●　审计记录</h3>${renderEvents(task.events)}</section>${discussing?'<p><button class="primary" id="discuss" type="button">启动方案、反方、调研讨论</button></p>':''}${readyForApproval?'<p><button class="approve" id="submit-approval" type="button">提交讨论，等待人工确认</button></p>':''}${waiting?'<div class="notice"><strong>●　等待你的确认</strong>确认仅将任务放入本机队列；当前版本不会自动执行。</div><p><button class="approve" id="approve" type="button">⌘　确认进入队列</button></p>':''}`;document.getElementById('close-detail').onclick=()=>{selectedId='';detail.innerHTML='<div class="detail-empty">从看板选择一个任务<br><span class="readonly">任务合同、审批和审计记录会显示在这里。</span></div>';load();};if(discussing)document.getElementById('discuss').onclick=async()=>{const button=document.getElementById('discuss');button.disabled=true;button.textContent='三个 Agent 正在并行讨论…';await request('/api/tasks/'+id+'/discuss',{method:'POST'});await showDetail(id);};if(readyForApproval)document.getElementById('submit-approval').onclick=async()=>{await request('/api/tasks/'+id+'/transition/awaiting_approval',{method:'POST'});await showDetail(id);};if(waiting)document.getElementById('approve').onclick=async()=>{await request('/api/tasks/'+id+'/approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({})});await showDetail(id);};}
    document.getElementById('new-task').onclick=()=>document.getElementById('create-panel').hidden=false; document.getElementById('create-submit').onclick=async()=>{const input=document.getElementById('task-title');if(!input.value.trim())return input.focus();const task=await request('/api/tasks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:input.value})});await request('/api/tasks/'+task.id+'/transition/deliberating',{method:'POST'});input.value='';document.getElementById('create-panel').hidden=true;await showDetail(task.id);}; load();
  </script>
</body>
</html>
