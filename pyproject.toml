[project]
name = "multi-agent-workbench"
version = "0.1.0"
description = "A local, review-first multi-agent collaboration prototype."
requires-python = ">=3.11"
dependencies = [
  "langgraph==1.2.11",
  "openai==3.14.1",
  "pytest==9.0.2",
]

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
testpaths = ["tests"]
